<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#10233f">
    <meta name="description" content="Kuicks — a quick, tactical dice game for the whole table.">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/app.css">
    <title>Kuicks</title>
  </head>
  <body>
    <main class="shell">
      <header class="brand" aria-labelledby="app-title">
        <div class="mark" aria-hidden="true">K</div>
        <div>
          <p class="eyebrow">Fast dice. Sharp choices.</p>
          <h1 id="app-title">Kuicks</h1>
        </div>
      </header>

      <section class="launch-card" aria-labelledby="checkpoint-title">
        <span class="phase-badge">Phase 2 checkpoint</span>
        <h2 id="checkpoint-title">Test the engine yourself.</h2>
        <p>Run five deterministic checks against the actual Kuicks rules engine in this browser.</p>
        <div class="trail-preview" aria-label="Four Kuicks trails">
          <span class="trail trail--sun">1</span>
          <span class="trail trail--coral">2</span>
          <span class="trail trail--sky">3</span>
          <span class="trail trail--mint">4</span>
        </div>
        <button id="run-checks" class="run-button" type="button">Run engine checks</button>
        <p id="run-summary" class="run-summary" role="status" aria-live="polite">Ready when you are.</p>
        <ol id="check-results" class="check-results" aria-label="Engine check results"></ol>
        <p class="next-up">Acceptance target: 5 of 5 checks pass.</p>
      </section>

      <footer>
        <span id="connection-status" role="status">Ready</span>
        <span id="build-id">Build loading…</span>
      </footer>
    </main>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
